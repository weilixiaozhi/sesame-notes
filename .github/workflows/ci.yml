name: CI

on:
  workflow_dispatch:

jobs:
  checks:
    name: Lint / Typecheck / Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.15.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.1
          cache: pnpm
      - name: 安装依赖（锁定文件）
        run: pnpm install --frozen-lockfile
      - name: Build（先构建共享客户端，供 Web 类型检查和测试使用）
        run: pnpm build
      - name: Lint
        run: pnpm lint
      - name: 格式检查
        run: pnpm format:check
      - name: 模块边界规则测试
        run: pnpm test:rules
      - name: Python 脚本回归（隔离夹具与模拟部署资源）
        run: python3 -B scripts/test/run.py
      - name: 文件循环依赖检查
        run: pnpm analyze:deps
      - name: 测试环境配置校验
        run: pnpm --filter @sesame-notes/api test:config
      - name: Typecheck
        run: pnpm typecheck
      - name: 契约生成一致性与固定基线兼容检查
        run: pnpm contract:check
      - name: API Client 生成一致性
        run: pnpm --filter @sesame-notes/api-client generate:check
      - name: API Client 单测
        run: pnpm --filter @sesame-notes/api-client test
      - name: 用户 Web 全量随机单元与组件测试
        run: pnpm --filter @sesame-notes/web test
      - name: Admin 单测
        run: pnpm --filter @sesame-notes/admin test

  integration:
    name: Test PostgreSQL Integration（空库初始化 + 业务回归）
    runs-on: ubuntu-latest
    env:
      SESAME_ENV: test
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: sesame
          POSTGRES_PASSWORD: sesame
          POSTGRES_DB: sesame_notes_test_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sesame -d sesame_notes_test_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.15.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.1
          cache: pnpm
      - name: 安装依赖（锁定文件）
        run: pnpm install --frozen-lockfile
      - name: 空库同步 schema 并初始化数据库不变量
        run: pnpm --filter @sesame-notes/api db:setup
        env:
          DATABASE_URL: postgresql://sesame:sesame@127.0.0.1:5432/sesame_notes_test_ci
      - name: 全量测试（真实 PostgreSQL）
        run: pnpm --filter @sesame-notes/api test
        env:
          DATABASE_URL: postgresql://sesame:sesame@127.0.0.1:5432/sesame_notes_test_ci
          E2E_DATABASE_URL: postgresql://sesame:sesame@127.0.0.1:5432/sesame_notes_test_ci
